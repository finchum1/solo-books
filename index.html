<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0b0d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Solo Books" />
    <meta
      name="description"
      content="Solo Books — one ledger for every business you run. Log income and expenses in seconds, then pull a Profit & Loss for all of them combined or any one alone."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Solo Books</title>
    <script>
      // Applied before React mounts to avoid a flash of the wrong theme.
      (function () {
        var stored = localStorage.getItem('theme');
        if (stored ? stored === 'dark' : true) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <!--
      THESIS: A bookkeeping product that looks like a private bank's website:
      restrained black, white and one gold, with a floating liquid-glass pill
      for navigation and the name set enormous on the last line of the page.
      Refuses the single scrolling landing page and the icon-card grid.
      OWN-WORLD: Graphite black and clean white grounds with a light/dark
      toggle; champagne gold (#cbb078) as fill, deepened to #85692f when it is
      text on white; Hanken Grotesk alone, tabular figures for money; hairline
      borders; glass reserved for the header and one product chip; footer and
      Payroll band stay black in both themes.
      STORY: An owner-operator learns it runs one business or several, now
      with payroll, trusts it with their records, and signs up.
      FIRST VIEWPORT: Pill header over a centered 5rem headline, one gold
      action, and the real Ledger screen rising beneath it.
      FORM: Pinned by the user's brief (no concept roll): multi-page site,
      SOLO BOOKS wordmark fitted edge to edge on the footer's bottom edge.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
